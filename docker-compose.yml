version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-mitzuri
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: mitzuriAri3LRG1.rxj
      POSTGRES_DB: mitzuri_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend-mitzuri
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: dev_user
      DB_PASSWORD: mitzuriAri3LRG1.rxj
      DB_NAME: mitzuri_dev

volumes:
  postgres_data: